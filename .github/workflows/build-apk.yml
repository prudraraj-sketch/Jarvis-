name: Build GestureControl release APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: gesturecontrol-release-build
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify signed Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 SDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Require persistent release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $secret_name"
              exit 1
            fi
          done
          echo "All persistent release-signing secrets are configured."

      - name: Restore and verify private release signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/gesturecontrol-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null
          echo "RELEASE_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Private release keystore restored and alias verified."

      - name: Verify project and download pinned model
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/example/gesturecontrol/GestureConsent.kt
          bash download_models.sh
          test -s app/src/main/assets/hand_landmarker.task

      - name: Build non-debuggable release APK
        run: gradle assembleRelease --no-daemon

      - name: Verify APK signature, signing identity, debuggability and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$APKANALYZER"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          ACTUAL_CERT_SHA256="$(keytool -list -v -keystore "$RELEASE_KEYSTORE_FILE" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | awk '/SHA256:/{gsub(":","",$2); print toupper($2); exit}')"
          APK_CERT_SHA256="$(awk -F': ' '/certificate SHA-256 digest:/{gsub(":","",$2); print toupper($2); exit}' "$RUNNER_TEMP/apk-signature.txt")"
          if [[ -z "$ACTUAL_CERT_SHA256" || "$ACTUAL_CERT_SHA256" != "$APK_CERT_SHA256" ]]; then
            echo "APK was not signed by the configured persistent release certificate." >&2
            exit 1
          fi

          DEBUGGABLE="$("$APKANALYZER" manifest debuggable "$APK")"
          if [[ "$DEBUGGABLE" != "false" ]]; then
            echo "Release APK must not be debuggable (got: $DEBUGGABLE)." >&2
            exit 1
          fi

          PERMISSIONS="$("$APKANALYZER" manifest permissions "$APK")"
          if grep -q "android.permission.INTERNET" <<< "$PERMISSIONS"; then
            echo "Unexpected INTERNET permission found in final APK." >&2
            exit 1
          fi

          if ! grep -q "android.permission.CAMERA" <<< "$PERMISSIONS"; then
            echo "Camera permission missing from final APK." >&2
            exit 1
          fi

      - name: Package APK and SHA-256 checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          VERSION="v1.1.0-build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          cp app/build/outputs/apk/release/app-release.apk "release/GestureControl-${VERSION}.apk"
          (cd release && sha256sum "GestureControl-${VERSION}.apk" > SHA256SUMS.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h app/build/outputs/apk/release/app-release.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: GestureControl-${{ steps.package.outputs.version }}
          path: |
            release/*.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo '## GestureControl release build'
            echo '- Build result: SUCCESS'
            echo '- Signing: persistent private release key'
            echo '- Signing certificate: matched to configured keystore'
            echo '- Android target: API 36'
            echo '- APK debuggable: false'
            echo '- INTERNET permission: absent'
            echo '- APK signature: verified'
            echo '- Artifact retention: 30 days'
          } >> "$GITHUB_STEP_SUMMARY"
